<style>
*{box-sizing:border-box} body{margin:0;background:#f5f5f2;font-family:Arial,sans-serif;color:#222;text-align:center}
.wrap{max-width:1000px;margin:auto;padding:12px}
#banner{min-height:92px;display:flex;align-items:center;justify-content:center;gap:16px;font-weight:800;font-size:clamp(30px,5vw,58px)}
#banner .sym{font-size:1.25em}
.clock{position:relative;width:min(96vw,820px);aspect-ratio:1/1;margin:auto;cursor:pointer;overflow:hidden}
.clock img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}
.arrow{position:absolute;left:50%;top:50%;width:37%;height:9%;transform-origin:0 50%;pointer-events:none;will-change:transform}
.arrow svg{width:100%;height:100%;overflow:visible}
.hub{position:absolute;left:50%;top:50%;width:25px;height:25px;transform:translate(-50%,-50%);border-radius:50%;background:#222;border:4px solid #fff;pointer-events:none}
button{margin-top:10px;font-size:22px;font-weight:700;padding:12px 28px;border-radius:12px;border:2px solid #222;background:white;cursor:pointer}
button:disabled{opacity:.6}
</style>

body {
  min-height: 0 !important;
}
#viewportFit {
  position: fixed;
  inset: 0;

}
#fitContent {
  position: absolute;

}
</style>

<script>
(()=>{
const months=["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"], icons=["⛄", "🎭", "🌷", "🌦️", "🌸", "🍓", "🏖️", "🐚", "🍎", "🍂", "🧥", "🎄"];
const arrow=document.getElementById('arrow'),banner=document.getElementById('banner'),btn=document.getElementById('spin'),clock=document.getElementById('clock');
/* Bildgeometrie: Januar liegt ca. 315°, Februar 345°, März 15° usw.
   Der Pfeil selbst zeigt in CSS bei 0° nach rechts. */
const monthAngles=[225,255,285,315,345,15,45,75,105,135,165,195];
let angle=monthAngles[0],busy=false,lastSector=null,audioCtx=null;
const setArrow=a=>arrow.style.transform=`translateY(-50%) rotate(${a}deg)`;
setArrow(angle);



function ensureAudio(){
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
 }catch(e){return null}
}
let tickCount=0;
function tick(){
 const c=ensureAudio(); if(!c)return;
 const now=c.currentTime; tickCount++;
 // Knackiger Glücksrad-"TOK": Holzclick + kleine wechselnde Tonhöhe
 const len=Math.floor(c.sampleRate*.035), b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);
 const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 n.buffer=b;f.type='bandpass';f.frequency.value=1200+(tickCount%3)*180;f.Q.value=1.1;
 g.gain.setValueAtTime(.15,now);g.gain.exponentialRampToValueAtTime(.001,now+.04);
 n.connect(f);f.connect(g);g.connect(c.destination);n.start(now);
 const o=c.createOscillator(),og=c.createGain();
 o.type='triangle';o.frequency.setValueAtTime(240+(tickCount%4)*18,now);o.frequency.exponentialRampToValueAtTime(115,now+.045);
 og.gain.setValueAtTime(.07,now);og.gain.exponentialRampToValueAtTime(.001,now+.05);
 o.connect(og);og.connect(c.destination);o.start(now);o.stop(now+.055);
 // alle paar Klicks ein winziges "boing" für mehr Spielzeug-/Gameshow-Gefühl
 if(tickCount%5===0){
  const q=c.createOscillator(),qg=c.createGain();

const monthAudio = monthAudioData.map(src => { const a=new Audio(src); a.preload="auto"; return a; });
function playMonthAudio(idx){
  monthAudio.forEach(a=>{a.pause();a.currentTime=0;});
  const a=monthAudio[idx];
  setTimeout(()=>{a.currentTime=0;a.play().catch(()=>{});},470);
}

function spin(){
 if(busy)return;busy=true;btn.disabled=true;banner.textContent='…';lastSector=null;
 const idx=Math.floor(Math.random()*12);
 const target=monthAngles[idx];
 const normalized=((target-angle)%360+360)%360;
 const finalAngle=angle + 1440 + normalized; // exakt dieselbe Endposition, kein anschließender Sprung
 const startAngle=angle, t0=performance.now(), duration=3200+Math.random()*700;
 function frame(now){
  const p=Math.min(1,(now-t0)/duration), eased=1-Math.pow(1-p,4);
  const current=startAngle+(finalAngle-startAngle)*eased;
  setArrow(current);
  const sector=Math.floor((((current%360)+360)%360)/30);
  if(sector!==lastSector){tick();lastSector=sector}
  if(p<1)requestAnimationFrame(frame); else {
    /* Wichtig: Winkel NICHT auf einen anderen Basiswinkel zurücksetzen.
       Nur modulo 360 intern speichern, optisch bleibt exakt die Endstellung. */
    angle=((finalAngle%360)+360)%360;
    setArrow(finalAngle);
    banner.innerHTML='<span>'+months[idx]+'</span><span class="sym" aria-hidden="true">'+icons[idx]+'</span>';
    finishSound();playMonthAudio(idx);btn.disabled=false;busy=false;
  }
 }
 requestAnimationFrame(frame)
}
btn.addEventListener('click',spin);clock.addEventListener('click',spin);
clock.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin()}});
})();

<script>
(function(){
  function fitWholeApp(){
    const box = document.getElementById('viewportFit');
    const content = document.getElementById('fitContent');
    if(!box || !content) return;

    // First measure at natural size.
    content.style.transform = 'translate(-50%, -50%) scale(1)';
    const w = content.scrollWidth;
    const h = content.scrollHeight;
    const availW = box.clientWidth - 20;
    const availH = box.clientHeight - 20;
    if(!w || !h) return;

    const scale = Math.min(availW / w, availH / h, 1);
    content.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('load', () => {
    fitWholeApp();
    setTimeout(fitWholeApp, 100);
    setTimeout(fitWholeApp, 500);
  });
  window.addEventListener('resize', fitWholeApp);
})();
</script>

<div id="snowLayer"></div><script>
(function(){
 const hot=document.getElementById('winterHotspot'), layer=document.getElementById('snowLayer');
 function one(){
   const f=document.createElement('span'); f.className='snowflake';
   f.textContent=Math.random()<.78?'❄':'•';
   f.style.left=(Math.random()*100)+'vw';
   f.style.fontSize=(12+Math.random()*24)+'px';
   f.style.opacity=(.45+Math.random()*.5);
   const d=4+Math.random()*5; f.style.animationDuration=d+'s';
   layer.appendChild(f); setTimeout(()=>f.remove(),(d+.5)*1000);
 }
 function snow(){
   for(let i=0;i<40;i++)setTimeout(one,i*35);
   let n=0,t=setInterval(()=>{one();if(Math.random()>.45)one();if(++n>80)clearInterval(t)},120);
 }
 hot.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();snow()});
 hot.addEventListener('pointerdown',e=>e.stopPropagation());
})();
</script>
<script>
(function () {
  let mobileAudioUnlocked = false;

  function unlockMobileAudio() {
    if (mobileAudioUnlocked) return;
    mobileAudioUnlocked = true;

    try {
      if (typeof monthAudio !== "undefined" && Array.isArray(monthAudio)) {
        monthAudio.forEach(function(a) {
          try {
            const oldMuted = a.muted;
            a.muted = true;
            const p = a.play();
            if (p && typeof p.then === "function") {
              p.then(function() {
                a.pause();
                a.currentTime = 0;
                a.muted = oldMuted;
              }).catch(function() {
                a.muted = oldMuted;
              });
            } else {
              a.pause();
              a.currentTime = 0;
              a.muted = oldMuted;
            }
          } catch(e) {}
        });
      }

      // Also unlock WebAudio while we're inside the user's gesture.
      if (typeof audioCtx !== "undefined" && audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(function(){});
      }
    } catch(e) {}
  }

  // Capture phase: unlock BEFORE the existing spin handler starts.
  document.addEventListener("pointerdown", unlockMobileAudio, {capture:true, once:true});
  document.addEventListener("touchstart", unlockMobileAudio, {capture:true, once:true, passive:true});
  document.addEventListener("click", unlockMobileAudio, {capture:true, once:true});
})();
</script>
